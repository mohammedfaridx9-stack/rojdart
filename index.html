<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<!--
  ============================================================================
  Control · Ghønim  —  Smart Industrial Dashboard  |  لوحة التحكم الصناعية الذكية
  تم التصميم والبرمجة بواسطة المهندس / محمد غنيم
  Developed & Engineered by Mohamed Ghonim
  ----------------------------------------------------------------------------
  Target: ROJ DART (90W) yarn feeder + STIRO G2D / Stela G2D machines
  MCU   : ESP32 DevKit V1 (isolated via PC817, powered by L7805 + 10uF/0.1uF)

  PROTOCOL (JSON, one object per message, ESP32 -> App), all keys optional:
    {"power":1,"yarn":1,"yarnCount":0,"rpm":1200,"temp":31.5,"hum":48,
     "fan":0,"fanMode":"auto","fanOk":1,"vin":11.8,"vout":5.02,"opto":1}
      yarn: 1 = intact, 0 = broken   opto: 1 = isolation healthy   temp: always Celsius
  App -> ESP32:
    {"cmd":"power","value":1}
    {"cmd":"lcd","line1":"Hello","line2":"World"}
    {"cmd":"fan","mode":"auto|manual","value":0|1,"threshold":35,"hyst":2}
    {"cmd":"buzzer","value":1|0}                       (Active Buzzer ON/OFF)
    {"cmd":"alerts","buzzer":1,"rpmEn":1,"rpmMin":800,"rpmMax":1800,
     "tempEn":1,"tempMin":10,"tempMax":45,"humEn":1,"humMin":20,"humMax":80,
     "yarnEn":1,"fanEn":1,"powerEn":1}                 (sent on connect + on every change)
  Transports:
    Wi-Fi WebSocket : ws://<ESP32_IP>:81/
    Wi-Fi HTTP      : GET http://<ESP32_IP>/status (JSON), POST /cmd (JSON)
    Bluetooth (BLE) : Nordic UART Service 6e400001-b5a3-f393-e0a9-e50e24dcca9e
                      (RX 6e400002..., TX 6e400003...), newline-terminated JSON
  Note: Web Bluetooth / PWA install require HTTPS (or localhost).
  ============================================================================
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220" id="metaTheme">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Control">
<meta name="author" content="Mohamed Ghonim">
<title>Control · Ghønim</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
/* Designed & Programmed by Eng. Mohamed Ghonim */
:root{--acc:#38bdf8;--acc2:#a78bfa;--on:#04101f;--r:18px;--pad:14px;--gap:12px;--blur:10px;
--bg:#0b1220;--bg1:#1b2a4d;--bg2:#2a1b4d;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12);--tx:#e8eefc;--mut:#8fa0c2;
--panel:#0e1730;--hdr:rgba(11,18,32,.78);--inp:rgba(0,0,0,.3);--track:#1b2542;--shadow:rgba(0,0,0,.25);
--ok:#22d3a0;--warn:#fbbf24;--bad:#fb5a6b}
[data-theme=light]{--bg:#eef2fa;--bg1:#d6e4ff;--bg2:#eddcff;--card:rgba(255,255,255,.78);--bd:rgba(20,30,60,.13);--tx:#111a33;--mut:#5a6784;
--panel:#ffffff;--hdr:rgba(255,255,255,.82);--inp:rgba(20,30,60,.06);--track:#dbe2f1;--shadow:rgba(40,60,110,.14);--ok:#0b8f6a;--warn:#a96b00;--bad:#d6334a}
[data-theme=amoled]{--bg:#000;--bg1:#000;--bg2:#000;--card:rgba(255,255,255,.05);--bd:rgba(255,255,255,.15);--panel:#070707;--hdr:rgba(0,0,0,.85);--track:#161616;--inp:rgba(255,255,255,.07)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:'Cairo',system-ui,sans-serif;background:radial-gradient(1200px 600px at 80% -10%,var(--bg1) 0,transparent 60%),radial-gradient(900px 500px at -10% 110%,var(--bg2) 0,transparent 55%),var(--bg);background-attachment:fixed;color:var(--tx);min-height:100vh;padding-bottom:88px;transition:background .3s,color .3s}
body.notab{padding-bottom:24px}
body.solid{--blur:0px}body.solid .card{background:var(--panel)}
body.compact{--pad:10px;--gap:8px}body.compact main{padding:10px}
body.noanim *{animation:none!important;transition:none!important}
.sub{display:block;font-size:.78em;font-weight:400;opacity:.72;line-height:1.35}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--hdr);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.ibtn{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:12px;width:40px;height:40px;font-size:1.1rem;cursor:pointer;flex:none}
.ttl{flex:1;min-width:0;line-height:1.25}.brandrow{display:flex;align-items:center;gap:7px}
.brandrow b{font-size:1.15rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:.68rem;font-weight:800;padding:2px 8px;border-radius:99px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--on);letter-spacing:.3px;white-space:nowrap}
.ttl small{color:var(--acc);font-size:.62rem;display:block}
.pill{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:99px;border:1px solid var(--bd);background:var(--card);font-size:.72rem;cursor:pointer;color:var(--tx);flex:none;font-family:inherit}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px currentColor;color:var(--bad)}
.dot.on{background:var(--ok);color:var(--ok)}.dot.demo{background:var(--warn);color:var(--warn)}
main{max-width:980px;margin:auto;padding:14px}
.view{display:none;animation:fade .3s}.view.show{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:var(--gap);grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:var(--pad);backdrop-filter:blur(var(--blur));box-shadow:0 8px 30px var(--shadow);transition:border-color .2s,transform .2s,background .3s}
.card[hidden]{display:none}
.card h3{font-size:.88rem;color:var(--mut);display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:600}
.tap{cursor:pointer}.tap:active{transform:scale(.98)}.tap:hover{border-color:var(--acc)}
.big{font-size:2.1rem;font-weight:800;line-height:1.2}.unit{font-size:.88rem;color:var(--mut);margin-inline-start:4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.badge{padding:3px 10px;border-radius:99px;font-size:.75rem;font-weight:600;display:inline-block}
.b-ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}.b-bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}.b-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.btn{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;color:var(--on);font-weight:800;font-family:inherit;padding:10px 16px;border-radius:calc(var(--r) * .7);cursor:pointer;font-size:.88rem;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn.red{background:linear-gradient(135deg,#fb5a6b,#f97316);color:#fff}
.switch{position:relative;width:86px;height:44px;border-radius:99px;background:var(--track);border:1px solid var(--bd);cursor:pointer;transition:.3s;flex:none}
.switch::after{content:'';position:absolute;top:4px;inset-inline-start:4px;width:34px;height:34px;border-radius:50%;background:#fff;transition:.3s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.switch.on{background:linear-gradient(135deg,#10b981,var(--ok));box-shadow:0 0 18px color-mix(in srgb,var(--ok) 50%,transparent)}
.switch.on::after{inset-inline-start:46px}
.switch.sm{width:54px;height:30px}.switch.sm::after{width:22px;height:22px;top:3px;inset-inline-start:3px}.switch.sm.on::after{inset-inline-start:27px}
.master{display:flex;align-items:center;justify-content:space-between}
input[type=text],input[type=number]{width:100%;background:var(--inp);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:10px;font-family:inherit;font-size:.95rem;margin:6px 0}
input.num{width:92px;margin:0;text-align:center}input.txt{width:150px;margin:0}
input[type=range]{accent-color:var(--acc);width:130px}
.lcd{background:#1f3a1b;border:4px solid #0d1a0c;border-radius:10px;padding:12px;font-family:'Courier New',monospace;direction:ltr;color:#b6ff7a;text-shadow:0 0 6px #7dff3a;font-size:clamp(14px,4.4vw,22px);letter-spacing:2px;margin:8px 0;box-shadow:inset 0 0 20px rgba(0,0,0,.6)}
.lcd div{white-space:pre;height:1.4em}
.fan{width:46px;height:46px;border-radius:50%;border:3px solid var(--acc);border-top-color:transparent;border-bottom-color:transparent;flex:none}
.fan.spin{animation:sp .5s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:12px;overflow:hidden;flex-wrap:wrap}
.seg button{background:transparent;border:0;color:var(--mut);padding:7px 12px;font-family:inherit;cursor:pointer;font-size:.82rem;transition:background .2s}
.seg button.a{background:var(--acc);color:var(--on);font-weight:700}
.back{margin-bottom:12px}.back::before{content:'→ '}[dir=ltr] .back::before{content:'← '}
canvas{max-width:100%}
.chartbox{height:220px;position:relative}
table{width:100%;border-collapse:collapse;font-size:.82rem}th,td{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:start}th{color:var(--mut);font-weight:600}
.scroll{max-height:240px;overflow:auto}
.drawer{position:fixed;inset:0;z-index:50;visibility:hidden}.drawer.open{visibility:visible}
.drawer .bg{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .25s}.drawer.open .bg{opacity:1}
.drawer nav{position:absolute;top:0;bottom:0;inset-inline-start:0;width:290px;max-width:84%;background:var(--panel);border-inline-end:1px solid var(--bd);padding:18px;display:flex;flex-direction:column;gap:4px;overflow:auto;transform:translateX(100%);transition:transform .28s}
[dir=ltr] .drawer nav{transform:translateX(-100%)}
.drawer.open nav{transform:none}
.drawer nav h2{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:1.2rem}
.drawer nav a{display:flex;align-items:center;gap:10px;padding:11px;border-radius:12px;cursor:pointer;color:var(--tx);font-size:.92rem}.drawer nav a:hover{background:var(--card)}
.drawer nav a i{font-style:normal;width:1.4em;text-align:center}
.sig{margin-top:auto;font-size:.72rem;color:var(--mut);border-top:1px solid var(--bd);padding-top:12px;line-height:1.7}.sig b{color:var(--acc)}
footer{text-align:center;color:var(--mut);font-size:.72rem;padding:18px 10px 6px;line-height:1.8}footer b{color:var(--acc)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:14px}
.modal.open{display:flex}.modal .card{width:100%;max-width:420px;background:var(--panel)}
.modal .btn{width:100%;margin-top:8px}
.toast{position:fixed;bottom:92px;inset-inline:14px;margin:auto;max-width:420px;background:var(--panel);border:1px solid var(--bd);padding:12px;border-radius:12px;z-index:70;display:none;text-align:center;font-size:.88rem;box-shadow:0 8px 30px var(--shadow)}
.tabbar{position:fixed;bottom:0;inset-inline:0;z-index:20;display:flex;justify-content:space-around;background:var(--hdr);backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
body.notab .tabbar{display:none}
.tabbar a{flex:1;text-align:center;font-size:.62rem;color:var(--mut);padding:4px 1px;cursor:pointer;position:relative;line-height:1.25}.tabbar a i{display:block;font-style:normal;font-size:1.2rem}.tabbar a.a{color:var(--acc)}
.tdot{position:absolute;top:0;inset-inline-end:20%;background:var(--bad);color:#fff;border-radius:99px;font-size:.62rem;font-weight:700;padding:0 6px;display:none}
.alarm{position:sticky;top:calc(var(--hh,64px) + 6px);z-index:15;display:none;align-items:center;justify-content:space-between;gap:10px;background:rgba(251,90,107,.95);color:#fff;border-radius:14px;padding:10px 12px;margin-bottom:12px;font-weight:700;font-size:.82rem;line-height:1.7;animation:pulse 1s infinite;box-shadow:0 6px 24px rgba(251,90,107,.4)}
@keyframes pulse{50%{box-shadow:0 0 22px rgba(251,90,107,.7)}}
.alarm .btn{background:#fff;color:#b4182d;white-space:nowrap;padding:8px 12px}
.card.alarming{border-color:var(--bad);box-shadow:0 0 22px color-mix(in srgb,var(--bad) 35%,transparent)}
.lbl{flex:1;font-size:.75rem;color:var(--mut)}
/* settings */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip2{flex:none;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:99px;padding:7px 13px;font-family:inherit;font-size:.78rem;cursor:pointer}
.chip2:hover{border-color:var(--acc)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}
.opt:last-child{border-bottom:0}
.opt .tx{flex:1;min-width:0}.opt .tx b{display:block;font-size:.92rem;font-weight:600}.opt .tx small{color:var(--mut);font-size:.72rem;display:block;line-height:1.5}
.rg{display:flex;align-items:center;gap:8px}.rv{font-size:.8rem;min-width:46px;text-align:end;color:var(--acc)}
.sws{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:200px}
.swc{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.swc.a{border-color:var(--tx);box-shadow:0 0 0 2px var(--bg)}
input[type=color]{width:30px;height:30px;border:0;padding:0;background:none;border-radius:50%;cursor:pointer}
.setsec{margin-bottom:var(--gap);scroll-margin-top:calc(var(--hh,64px) + 10px)}
.setsec h3{font-size:.95rem;color:var(--tx)}
#report{position:fixed;left:-10000px;top:0;width:760px;background:#fff;color:#111;padding:24px;font-family:'Cairo',Arial,sans-serif}
#report table td,#report table th{border:1px solid #ccc;padding:5px;font-size:12px}
</style>
</head>
<body>
<header>
  <button class="ibtn" id="menuBtn" aria-label="menu">☰</button>
  <div class="ttl"><div class="brandrow"><b id="brand">كريتڤ</b><span class="chip">Ghønim</span></div><small data-i18n="sig_short"></small></div>
  <button class="ibtn" data-go="settings" aria-label="settings">⚙️</button>
  <button class="pill" id="connPill"><span class="dot" id="connDot"></span><span id="connTxt"></span></button>
</header>

<div class="drawer" id="drawer"><div class="bg" id="drawerBg"></div>
<nav>
  <h2><span id="brand2">كريتڤ</span><span class="chip">Ghønim</span></h2>
  <a data-go="home"><i>🏠</i><span data-i18n="home"></span></a>
  <a data-go="yarn"><i>🧵</i><span data-i18n="p_yarn"></span></a>
  <a data-go="speed"><i>⚡</i><span data-i18n="p_speed"></span></a>
  <a data-go="dht"><i>🌡️</i><span data-i18n="p_dht"></span></a>
  <a data-go="power"><i>🔌</i><span data-i18n="p_power"></span></a>
  <a data-go="alerts"><i>🔔</i><span data-i18n="alerts"></span></a>
  <a data-go="settings"><i>⚙️</i><span data-i18n="settings"></span></a>
  <a id="navConn"><i>📡</i><span data-i18n="n_conn"></span></a>
  <a id="navPdf"><i>📄</i><span data-i18n="b_pdf"></span></a>
  <a id="navCsv"><i>📊</i><span data-i18n="b_csv"></span></a>
  <a id="navInstall" style="display:none"><i>📲</i><span data-i18n="n_install"></span></a>
  <div class="sig">تم التصميم والبرمجة بواسطة<br><b>المهندس / محمد غنيم</b><br>Developed &amp; Engineered by<br><b>Mohamed Ghonim</b></div>
</nav></div>

<main>
<div class="alarm" id="alarmBar"><div id="alarmList"></div><button class="btn" id="muteBtn"></button></div>

<!-- HOME -->
<section class="view show" id="v-home">
  <div class="grid">
    <div class="card master" data-card="master"><div><h3><i>🔘</i><span data-i18n="master_t"></span></h3><div id="pwTxt" class="big" style="font-size:1.4rem"></div><span class="badge b-ok" id="pwBadge"></span></div><div class="switch on" id="masterSw"></div></div>

    <div class="card" data-card="lcd"><h3><i>🖥️</i><span data-i18n="lcd_t"></span></h3>
      <div class="lcd"><div id="lcd1"></div><div id="lcd2"></div></div>
      <input type="text" id="lcdIn" maxlength="32" data-i18n-ph="lcd_ph">
      <div class="row"><small id="lcdCnt" style="color:var(--mut)">0/32</small><button class="btn" id="lcdSend" data-i18n="lcd_send"></button></div>
      <small style="color:var(--mut);display:block;margin-top:6px" data-i18n="lcd_hint"></small></div>

    <div class="card" data-card="fan"><h3><i>🌀</i><span data-i18n="fan_t"></span></h3>
      <div class="row"><div class="fan" id="fanIcon"></div>
      <div><div id="fanTxt" class="big" style="font-size:1.25rem"></div><small id="fanTemp" style="color:var(--mut)"></small></div>
      <div class="switch" id="fanSw" style="width:74px"></div></div>
      <div class="row" style="margin-top:12px"><div class="seg" id="fanSeg"><button data-m="auto" class="a" data-i18n="mode_auto"></button><button data-m="manual" data-i18n="mode_manual"></button></div>
      <label class="lbl" style="display:flex;align-items:center;gap:6px;flex:none"><span data-i18n="thr_lbl"></span> <input class="num" type="number" id="thr" style="width:76px"><span class="tu"></span></label></div></div>
  </div>

  <h3 style="margin:16px 4px 8px;color:var(--mut)" data-i18n="sensors_h"></h3>
  <div class="grid">
    <div class="card tap" data-go="yarn" data-card="yarn"><h3><i>🧵</i><span data-i18n="yarn_c"></span></h3><div class="row"><div class="big" id="hYarn"></div><span class="badge b-ok" id="hYarnB"></span></div><small style="color:var(--mut)"><span data-i18n="breaks"></span>: <b id="hYarnC">0</b></small></div>
    <div class="card tap" data-go="speed" data-card="speed"><h3><i>⚡</i><span data-i18n="speed_c"></span></h3><div class="big"><span id="hRpm">0</span><span class="unit">RPM</span></div><small style="color:var(--mut)"><span data-i18n="pull"></span>: <b id="hPull">0</b> <span data-i18n="mmin"></span></small></div>
    <div class="card tap" data-go="dht" data-card="dht"><h3><i>🌡️</i><span data-i18n="dht_c"></span></h3><div class="big"><span id="hTemp">--</span><span class="unit tu"></span> <span style="font-size:1.2rem"><span id="hHum">--</span>%</span></div><small style="color:var(--mut)" data-i18n="rh"></small></div>
    <div class="card tap" data-go="power" data-card="power"><h3><i>🔌</i><span data-i18n="power_c"></span></h3><div class="big"><span id="hVout">5.00</span><span class="unit">V</span></div><span class="badge b-ok" id="hOpto"></span></div>
    <div class="card tap" data-go="alerts" data-card="alerts"><h3><i>🔔</i><span data-i18n="al_c"></span></h3><div class="big" id="hAlCnt">0</div><span class="badge b-ok" id="hAlB"></span></div>
  </div>
</section>

<!-- YARN -->
<section class="view" id="v-yarn"><button class="btn ghost back" data-go="home" data-i18n="back"></button>
  <div class="grid">
    <div class="card"><h3><i>🧵</i><span data-i18n="y_state"></span></h3><div class="big" id="yState"></div><span class="badge b-ok" id="yBadge"></span></div>
    <div class="card"><h3><i>🔢</i><span data-i18n="y_count"></span></h3><div class="big" id="yCount">0</div><div class="row" style="margin-top:8px"><button class="btn ghost" id="yReset" data-i18n="reset"></button></div></div>
  </div>
  <div class="card" style="margin-top:12px"><h3><i>🕒</i><span data-i18n="y_log"></span></h3><div class="scroll"><table><thead><tr><th>#</th><th data-i18n="time"></th><th>RPM</th></tr></thead><tbody id="yLog"></tbody></table></div></div>
</section>

<!-- SPEED -->
<section class="view" id="v-speed"><button class="btn ghost back" data-go="home" data-i18n="back"></button>
  <div class="grid">
    <div class="card"><h3><i>⏱️</i><span data-i18n="gauge_t"></span></h3><canvas id="gauge" width="300" height="180" style="display:block;margin:auto"></ca
